app-id: io.github.o_murphy.ebalistyka
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: ebalistyka

finish-args:
  - --share=network
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri

cleanup:
  - /flutter-sdk

modules:
  - name: flutter-sdk
    buildsystem: simple
    build-commands:
      - cp -r . /app/flutter-sdk
    sources:
      # Run scripts/generate-flutter-sdk-source.sh to get the sha256 for a new Flutter version
      - type: archive
        url: https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_3.41.6-stable.tar.xz
        sha256: 503b3e6b7d352fca5d21b6474eca95ad544d8fc3b053782eab63a360c7fc7569
        dest-filename: flutter.tar.xz

  - name: ebalistyka
    buildsystem: simple
    build-options:
      env:
        HOME: /run/build/ebalistyka
        PUB_CACHE: /run/build/ebalistyka/.pub-cache
        FLUTTER_ROOT: /app/flutter-sdk
        PATH: /app/flutter-sdk/bin:/usr/bin:/bin
    build-commands:
      - flutter config --no-analytics --no-cli-animations
      - flutter pub get --offline
      - flutter build linux --release
      - install -d /app/ebalistyka
      - cp build/linux/x64/release/bundle/ebalistyka /app/ebalistyka/
      - cp -r build/linux/x64/release/bundle/lib /app/ebalistyka/lib
      - cp -r build/linux/x64/release/bundle/data /app/ebalistyka/data
      - install -Dm755 flatpak/ebalistyka-wrapper.sh /app/bin/ebalistyka
      - install -Dm644 flatpak/io.github.o_murphy.ebalistyka.desktop
          /app/share/applications/io.github.o_murphy.ebalistyka.desktop
      - install -Dm644 flatpak/io.github.o_murphy.ebalistyka.png
          /app/share/icons/hicolor/512x512/apps/io.github.o_murphy.ebalistyka.png
      - install -Dm644 flatpak/io.github.o_murphy.ebalistyka.metainfo.xml
          /app/share/metainfo/io.github.o_murphy.ebalistyka.metainfo.xml
    sources:
      - type: git
        url: https://github.com/o-murphy/ebalistyka-app
        tag: v0.1.13
        commit: 4e8f8ae29cd5a7f3b5e8a7d1516c10e16883b903
      # Generated by scripts/generate-pub-sources.sh — run it after every pubspec.lock change
      - pub-sources.json
